<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Device check</title>
<style>
  :root { color-scheme: light dark; --bg: #F4F5F2; --fg: #171B19; --muted: #5C655F; --line: #DCE0DA; --ok: #1F7A4D; --bad: #B42318; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0D1210; --fg: #E8ECE6; --muted: #9AA59F; --line: #26302A; --ok: #5CC28F; --bad: #FF8A7A; --card: #141A17; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); width: 44%; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; }
  #status { font-weight: 600; margin: 12px 0; }
  /* the site copies must be on screen (they pause when off screen), so they sit faded out behind the results */
  .frames { position: fixed; inset: 0; z-index: -1; opacity: 0.02; pointer-events: none; }
  .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #svgtest { width: 60px; height: 20px; }
  #ytbox { width: 160px; height: 90px; margin-top: 12px; }
  #ytbox iframe { width: 160px; height: 90px; border: 0; }
  button { font: inherit; padding: 10px 16px; border-radius: 12px; border: 0; background: #A6BB43; color: #090D0C; font-weight: 650; margin-top: 12px; }
</style>
</head>
<body>
<h1>Device check</h1>
<p>Keep this page open about 15 seconds, then screenshot it (or tap Copy) and send it over. Nothing is sent anywhere.</p>
<div id="status">Running…</div>
<table><tbody id="out"></tbody></table>
<button type="button" id="copy">Copy results</button>
<svg id="svgtest" viewBox="0 0 60 20" aria-hidden="true"><path id="svgpath" d="M2,10 H58" stroke="#888" stroke-width="3" stroke-dasharray="2 10" fill="none"/></svg>
<div id="ytbox"><div id="ythold"></div></div>
<div class="frames" aria-hidden="true">
  <iframe id="f-ov" src="./#overview" title="overview"></iframe>
  <iframe id="f-hero" src="./#overview" title="hero" onload="try{var d=this.contentDocument;setTimeout(function(){d.getElementById('hero').scrollIntoView({block:'center'})},300)}catch(e){}"></iframe>
  <iframe id="f-sim" src="./#simulator" title="simulator" onload="try{var d=this.contentDocument;setTimeout(function(){d.getElementById('sec-pfd').scrollIntoView({block:'center'})},800)}catch(e){}"></iframe>
  <iframe id="f-ind" src="./#industry" title="industry"></iframe>
</div>
<style>@keyframes dg { to { stroke-dashoffset: -12; } } #svgpath { animation: dg 1s linear infinite; }</style>
<script>
(function () {
  const rows = [];
  const out = document.getElementById('out');
  const put = (k, v, good) => { rows.push([k, v]); const tr = document.createElement('tr'); tr.innerHTML = `<td>${k}</td><td class="${good === true ? 'ok' : good === false ? 'bad' : ''}">${v}</td>`; out.appendChild(tr); };
  const mq = (q) => (window.matchMedia ? window.matchMedia(q).matches : 'n/a');

  put('Browser', navigator.userAgent);
  put('Screen', `${innerWidth} × ${innerHeight} CSS px, DPR ${devicePixelRatio}`);
  const rm = mq('(prefers-reduced-motion: reduce)');
  put('Reduce Motion setting', rm ? 'ON (site keeps animations still)' : 'off', !rm);
  put('Reduced data / Save-Data', `${mq('(prefers-reduced-data: reduce)')} / ${!!(navigator.connection && navigator.connection.saveData)}`);
  put('Container query units', String(!!(window.CSS && CSS.supports && CSS.supports('width: 1cqw'))));

  // rAF rate (Low Power Mode on iPhone/iPad usually halves it to ~30)
  let n = 0; const t0 = performance.now();
  (function tick() { n++; if (performance.now() - t0 < 2000) requestAnimationFrame(tick); else put('Animation frames per second', `${Math.round(n / 2)} fps${n / 2 < 40 ? ' (looks like Low Power Mode)' : ''}`, n / 2 >= 40); })();

  // CSS keyframes on an SVG dash
  const path = document.getElementById('svgpath');
  const d0 = getComputedStyle(path).strokeDashoffset;
  setTimeout(() => { const d1 = getComputedStyle(path).strokeDashoffset; put('CSS animation on SVG', d0 !== d1 ? `runs (${d0} → ${d1})` : `frozen (${d0})`, d0 !== d1); }, 700);

  // IntersectionObserver on an SVG element
  if ('IntersectionObserver' in window) {
    let fired = false;
    new IntersectionObserver(() => { fired = true; }).observe(document.getElementById('svgtest'));
    setTimeout(() => put('Visibility events for SVG', fired ? 'fire' : 'never fire', fired), 1500);
  } else put('IntersectionObserver', 'missing', false);

  // The real site, loaded in hidden frames: do its own animation counters move?
  const read = (id, key) => { try { const w = document.getElementById(id).contentWindow; return w[key] ? JSON.parse(JSON.stringify(w[key])) : null; } catch (e) { return 'blocked'; } };
  setTimeout(() => {
    const a = { hero: read('f-hero', '__heroStats'), ov: read('f-ov', '__flowStats'), sim: read('f-sim', '__flowStats'), ind: read('f-ind', '__indVideo') };
    setTimeout(() => {
      const b = { hero: read('f-hero', '__heroStats'), ov: read('f-ov', '__flowStats'), sim: read('f-sim', '__flowStats'), ind: read('f-ind', '__indVideo') };
      const moved = (x, y) => x && y && typeof y.frames === 'number' ? y.frames - x.frames : null;
      const mh = moved(a.hero, b.hero), mo = moved(a.ov, b.ov), ms = moved(a.sim, b.sim);
      put('Site: hero frames in 3 s', mh == null ? 'not loaded' : String(mh), mh > 0);
      put('Site: Overview diagram frames in 3 s', mo == null ? 'not loaded (old version?)' : String(mo), mo > 0);
      put('Site: Simulator diagram frames in 3 s', ms == null ? 'not loaded (old version?)' : String(ms), ms > 0);
      put('Site: video state', b.ind ? `${b.ind.state} (API requested: ${b.ind.apiRequested})` : 'not loaded', b.ind ? b.ind.state === 'playing' : null);
    }, 3000);
  }, 5000);

  // A plain muted YouTube autoplay test
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => put('YouTube player script', 'blocked (ad/content blocker?)', false);
  document.head.appendChild(tag);
  let ytState = 'no start';
  window.onYouTubeIframeAPIReady = () => {
    put('YouTube player script', 'loaded', true);
    new YT.Player('ythold', { host: 'https://www.youtube-nocookie.com', videoId: 'rxYTx6aj96k', width: 160, height: 90,
      playerVars: { autoplay: 1, mute: 1, playsinline: 1, controls: 0 },
      events: { onReady: (e) => { e.target.mute(); e.target.playVideo(); }, onStateChange: (e) => { if (e.data === 1) ytState = 'PLAYING'; else if (ytState !== 'PLAYING') ytState = `state ${e.data}`; }, onError: (e) => { ytState = `error ${e.data}`; } } });
  };
  setTimeout(() => {
    put('Muted autoplay test', ytState === 'PLAYING' ? 'plays' : `${ytState} (autoplay blocked)`, ytState === 'PLAYING');
    document.getElementById('status').textContent = 'Done. Screenshot this page or tap Copy.';
  }, 13000);

  document.getElementById('copy').addEventListener('click', () => {
    const txt = rows.map((r) => `${r[0]}: ${r[1]}`).join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => { document.getElementById('copy').textContent = 'Copied'; });
  });
})();
</script>
</body>
</html>
